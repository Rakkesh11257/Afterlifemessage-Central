AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB table for afterlifemessage-backend-messages-dev

Resources:
  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: afterlifemessage-backend-messages-dev
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

Outputs:
  MessagesTableName:
    Description: Name of the DynamoDB messages table
    Value: !Ref MessagesTable 