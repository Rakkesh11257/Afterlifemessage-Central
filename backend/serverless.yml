service: afterlifemessage-backend

plugins:
  - ./plugins/ssm-stage-resolver

custom:
  # API Gateway base URL - stored in SSM Parameter Store
  apiGatewayBaseUrl: ${ssm:/afterlifemessage/${self:provider.stage}/api-gateway-url, true}

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}  # Default to 'dev' if not specified via --stage
  
  # Deployment bucket configuration
  deploymentBucket:
    name: afterlifemessage-backend-deployments-${self:provider.stage}
    blockPublicAccess: true
  
  # API Gateway configuration for larger payloads
  apiGateway:
    shouldStartNameWithService: true
    binaryMediaTypes:
      - '*/*'
    minimumCompressionSize: 1024
  
  # Lambda configuration for larger payloads
  timeout: 60  # Increased timeout for large file processing
  memorySize: 2048  # Increased memory for large file processing
  
  environment:
    # Core resource names (non-secret, stage-specific)
    USERS_TABLE: afterlifemessage-backend-users-${self:provider.stage}
    DYNAMODB_TABLE: afterlifemessage-backend-messages-${self:provider.stage}
    S3_BUCKET: afterlifemessage-${self:provider.stage}

    # Secrets loaded from AWS SSM Parameter Store (secure, never in code)
    # The ssm-stage-resolver plugin will replace ${self:provider.stage} with actual stage (dev/prod)
    # Using , true to decrypt SecureString parameters (Serverless v4 syntax)
    ZEPTO_PASSWORD: ${ssm:/afterlifemessage/${self:provider.stage}/zepto-password, true}
    ZEPTO_FROM_EMAIL: ${ssm:/afterlifemessage/${self:provider.stage}/zepto-from-email, true}
    WHATSAPP_ACCESS_TOKEN: ${ssm:/afterlifemessage/${self:provider.stage}/whatsapp-access-token, true}
    WHATSAPP_PHONE_NUMBER_ID: ${ssm:/afterlifemessage/${self:provider.stage}/whatsapp-phone-number-id, true}
    ENCRYPTION_KEY: ${ssm:/afterlifemessage/${self:provider.stage}/encryption-key, true}
    TWILIO_ACCOUNT_SID: ${ssm:/afterlifemessage/${self:provider.stage}/twilio-account-sid, true}
    TWILIO_AUTH_TOKEN: ${ssm:/afterlifemessage/${self:provider.stage}/twilio-auth-token, true}
    TWILIO_WHATSAPP_NUMBER: ${ssm:/afterlifemessage/${self:provider.stage}/twilio-whatsapp-number, true}
    COGNITO_USER_POOL_ID: ${ssm:/afterlifemessage/${self:provider.stage}/cognito-user-pool-id, true}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/afterlifemessage-backend-users-${self:provider.stage}
        - arn:aws:dynamodb:${self:provider.region}:*:table/afterlifemessage-backend-messages-${self:provider.stage}
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource:
        - arn:aws:s3:::afterlifemessage-${self:provider.stage}/*
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "*"
    # Allow Lambda to read secrets from SSM Parameter Store
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
        - ssm:GetParametersByPath
      Resource:
        - arn:aws:ssm:${self:provider.region}:*:parameter/afterlifemessage/${self:provider.stage}/*
    # Allow Lambda to access Cognito User Pool
    - Effect: Allow
      Action:
        - cognito-idp:AdminGetUser
      Resource:
        - arn:aws:cognito-idp:${self:provider.region}:*:userpool/*

functions:
  # Cognito authorizer (defined once, used by multiple functions)
  # Note: This is referenced in individual function events

  postConfirmation:
    handler: functions/migrateUser.handler
    environment:
      USERS_TABLE: ${self:provider.environment.USERS_TABLE}

  checkTriggers:
    handler: functions/checkTriggers.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      USERS_TABLE: ${self:provider.environment.USERS_TABLE}
      S3_BUCKET: ${self:provider.environment.S3_BUCKET}
      ZEPTO_PASSWORD: ${self:provider.environment.ZEPTO_PASSWORD}
      ZEPTO_FROM_EMAIL: ${self:provider.environment.ZEPTO_FROM_EMAIL}
      WHATSAPP_ACCESS_TOKEN: ${self:provider.environment.WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${self:provider.environment.WHATSAPP_PHONE_NUMBER_ID}
      MEDIA_JWT_SECRET: media-secret-key
      ENCRYPTION_KEY: ${self:provider.environment.ENCRYPTION_KEY}
      MEDIA_STREAM_BASE_URL: ${self:custom.apiGatewayBaseUrl}/${self:provider.stage}
    events:
      - schedule: cron(0 21 * * ? *)

  getDecryptedMedia:
    handler: functions/getDecryptedMedia.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      S3_BUCKET: ${self:provider.environment.S3_BUCKET}
      MEDIA_JWT_SECRET: media-secret-key
      ENCRYPTION_KEY: ${self:provider.environment.ENCRYPTION_KEY}
    events:
      - http:
          path: /media/{messageId}
          method: get
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  createMessage:
    handler: functions/createMessage.handler
    # FFmpeg Lambda Layer temporarily removed - add back when you have a publicly accessible layer
    # layers:
    #   - arn:aws:lambda:ap-south-1:558608220178:layer:ffmpeg:31
    timeout: 60
    memorySize: 2048
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      S3_BUCKET: ${self:provider.environment.S3_BUCKET}
      ENCRYPTION_KEY: ${self:provider.environment.ENCRYPTION_KEY}
    events:
      - http:
          path: /messages
          method: post
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  updateMessage:
    handler: functions/updateMessage.handler
    # FFmpeg Lambda Layer temporarily removed - add back when you have a publicly accessible layer
    # layers:
    #   - arn:aws:lambda:ap-south-1:558608220178:layer:ffmpeg:31
    timeout: 60
    memorySize: 2048
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      S3_BUCKET: ${self:provider.environment.S3_BUCKET}
      ENCRYPTION_KEY: ${self:provider.environment.ENCRYPTION_KEY}
    events:
      - http:
          path: /messages/{messageId}
          method: put
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  getUploadUrl:
    handler: functions/getUploadUrl.handler
    environment:
      S3_BUCKET: ${self:provider.environment.S3_BUCKET}
    events:
      - http:
          path: /upload-url
          method: post
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy


  getMessages:
    handler: functions/getMessages.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
    events:
      - http:
          path: /messages
          method: get
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  getMessage:
    handler: functions/getMessage.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
    events:
      - http:
          path: /messages/{messageId}
          method: get
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  deleteMessage:
    handler: functions/deleteMessage.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      S3_BUCKET: ${self:provider.environment.S3_BUCKET}
    events:
      - http:
          path: /messages/{messageId}
          method: delete
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  updateUserProfile:
    handler: functions/updateUserProfile.handler
    environment:
      USERS_TABLE: ${self:provider.environment.USERS_TABLE}
    events:
      - http:
          path: /user/profile
          method: put
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  getUserProfile:
    handler: functions/getUserProfile.handler
    environment:
      USERS_TABLE: ${self:provider.environment.USERS_TABLE}
      COGNITO_USER_POOL_ID: ${self:provider.environment.COGNITO_USER_POOL_ID}
    events:
      - http:
          path: /user/profile
          method: get
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  handlePayment:
    handler: functions/handlePayment.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
    events:
      - http:
          path: /payment/webhook
          method: post
          cors: true
          integration: lambda-proxy

  createPayment:
    handler: functions/createPayment.handler
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
    events:
      - http:
          path: /payment/create
          method: post
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  updateUserActivity:
    handler: functions/updateUserActivity.handler
    environment:
      USERS_TABLE: ${self:provider.environment.USERS_TABLE}
    events:
      - http:
          path: /activity
          method: post
          cors: true
          authorizer:
            arn: arn:aws:cognito-idp:ap-south-1:891377013673:userpool/ap-south-1_CRybCfDpw
          integration: lambda-proxy

  testWhatsApp:
    handler: functions/testWhatsApp.handler
    environment:
      WHATSAPP_ACCESS_TOKEN: ${self:provider.environment.WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${self:provider.environment.WHATSAPP_PHONE_NUMBER_ID}
    events:
      - http:
          path: /test-whatsapp
          method: post
          cors: true
          integration: lambda-proxy

# No resources section, as we are using an existing DynamoDB table and Cognito user pool 