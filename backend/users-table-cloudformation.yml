AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB table for afterlifemessage-backend-users-dev

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: afterlifemessage-backend-users-dev
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

Outputs:
  UsersTableName:
    Description: Name of the DynamoDB users table
    Value: !Ref UsersTable 